# ============================================================================
# stlink.cfg — ST-LINK + STM32H7 的 OpenOCD 配置(CLion / 命令行都用这个)
#
# ★ 为什么不沿用老的写法(下面这些是踩过的坑 ✗)：
#     source [find interface/stlink-v2.cfg]
#     transport select hla_swd
#   ⇒ stlink.cfg / stlink-v2.cfg 用的都是 **hla**(ST-LINK 的旧 HL 适配器接口)✗
#     而 hla **不支持 STM32H7** ✗:OpenOCD 打印到 "Info : clock speed ..." 就卡住不动
#     (你看到的就是这个现象:后面没有 SWD DPIDR、也没有 [stm32h7x.cpu0] Cortex-M7)
#
# 正确做法:**dap 传输**(dapdirect)= ST-LINK 的现代接口,支持 H7 ✓
# ----------------------------------------------------------------------------

# ① 接口:用 dap 版(它内部是 adapter driver dapdirect)
source [find interface/stlink-dap.cfg]

# ② 传输:优先 SWD(dap 直连)。若你的 ST-LINK 固件太老不支持 dapdirect,
#    把下面这行换成:  transport select dapdirect_jtag
#    (还不行就只能给 ST-LINK 升级固件 —— STM32CubeProgrammer 里可以升)
transport select dapdirect_swd

# ③ 目标
source [find target/stm32h7x.cfg]

# ④ 速度:4 MHz 比较稳(10 MHz 在便宜/克隆 ST-LINK 上容易失败)
adapter speed 4000

